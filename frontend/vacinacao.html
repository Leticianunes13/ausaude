<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacinação - Au Saúde</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <main class="container-vacinacao mt-5 fade-in delay-2">
        <!-- Logo -->
        <div class="container mt-4 mt-md-5">
            <div class="text-center mb-4">
                <h1 class="display-4 fw-bold logo-animada">
                    Vacinação <i class="bi bi-syringe-fill text-danger"></i>
                </h1>
                <p>Gerencie as vacinas dos seus pets de forma prática e organizada.</p>
            </div>
        </div>

        <div class="sticky-top menu-fixo py-3 mb-4 border-bottom">
            <div class="container">
                <nav class="nav flex-nowrap justify-content-md-center gap-3 fade-in delay-1 menu-scroll px-2">
                    <a class="btn btn-principal px-4 py-2 rounded-pill shadow-sm d-flex align-items-center gap-2 flex-shrink-0"
                        href="../index.html">
                        <i class="bi bi-house-door-fill"></i> Home
                    </a>
                    <a class="btn btn-secundario px-4 py-2 rounded-pill shadow-sm d-flex align-items-center gap-2 flex-shrink-0"
                        href="../frontend/perfil.html">
                        <i class="bi bi-hearts"></i> Meus Pets
                    </a>
                    <a class="btn btn-secundario px-4 py-2 rounded-pill shadow-sm d-flex align-items-center gap-2 flex-shrink-0"
                        href="vacinacao.html">
                        <i class="bi bi-syringe-fill"></i> Vacinas
                    </a>
                </nav>
            </div>
        </div>

        <section class="container vacinacao-content pb-5">
            <h2 class="h4 text-center mb-4" style="color: var(--cor-secundaria);">Histórico de Vacinas</h2>

            <div class="vacinacao-grid" id="listaVacinasRender">
                <div class="card-adicionar shadow-sm" data-bs-toggle="modal" data-bs-target="#modalVacina">
                    <i class="bi bi-file-plus fs-1 text-primary mb-2"></i>
                    <span class="fw-bold text-muted">Registar Nova Vacina</span>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modalVacina" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="modalVacinaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow" style="border-radius: 15px;">

                <div class="modal-header border-0 pb-0">
                    <h1 class="modal-title fs-5 fw-bold" id="modalVacinaLabel" style="color: var(--cor-secundaria);">
                        <i class="bi bi-shield-plus me-2"></i>Registar Vacina
                    </h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>

                <form class="pet-form" id="formCadastroVacina">
                    <div class="modal-body">
                        <label for="vacina-name">Nome da Vacina:</label>
                        <input type="text" id="vacina-name" class="form-control mb-3" placeholder="Ex: V10, Antirrábica"
                            required>

                        <label for="vacina-date">Data de Aplicação:</label>
                        <input type="date" id="vacina-date" class="form-control mb-3" required>

                        <label for="vacina-pet">Pet Selecionado:</label>
                        <select id="vacina-pet" class="form-select mb-3" required>
                            <option value="">Selecione o pet</option>
                        </select>
                    </div>

                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4"
                            data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-principal rounded-pill px-4">Guardar Vacina</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../backend/script.js"></script>
    <script src="vacinacao.js"></script>

</body>

</html>
